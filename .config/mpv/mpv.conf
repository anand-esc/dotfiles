# Hardware decoding on Intel Iris Xe (AV1/VP9/H.264 via VA-API): low CPU, better battery
hwdec=vaapi
vo=gpu-next
profile=high-quality

# HDR: tell Hyprland what the video is, so fullscreen HDR video switches the panel to
# HDR by itself (render.cm_auto_hdr) and back to SDR afterwards.
target-colorspace-hint=yes
# report the video's own colour space (PQ/BT.2020 for HDR) instead of converting it to
# what the screen currently shows (SDR), which never triggered the switch
target-colorspace-hint-mode=source

# YouTube via yt-dlp: up to 4K60, the HDR version when there is one (4K scaled down to
# the 2880x1800 panel is sharper than 1440p scaled up; Iris Xe decodes VP9/AV1 10-bit)
ytdl-format=bestvideo[height<=?2160][fps<=?60][dynamic_range^=HDR]+bestaudio/bestvideo[height<=?2160][fps<=?60]+bestaudio/best
ytdl-raw-options=sub-langs=en.*,write-auto-subs=

# Behaviour
keep-open=yes
save-position-on-quit=yes
volume-max=150
osd-bar=yes
force-window=immediate
