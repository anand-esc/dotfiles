shell=fish
title=foot
font=JetBrains Mono Nerd Font:size=12
letter-spacing=0
dpi-aware=no
pad=25x25
bold-text-in-bright=no
gamma-correct-blending=no

[scrollback]
lines=10000

[cursor]
style=beam
beam-thickness=1.5

[colors-dark]
alpha=0.78
alpha-mode=matching
blur=yes
foreground=e2e2e2
background=131313
selection-foreground=ffffff
selection-background=264f78
regular0=1e1e1e
regular1=e06c75
regular2=98c379
regular3=e5c07b
regular4=61afef
regular5=c678dd
regular6=56b6c2
regular7=c8c8c8
bright0=56688a
bright1=ff7b86
bright2=b5e890
bright3=ffd88a
bright4=82c4ff
bright5=dda0f0
bright6=7fd7e0
bright7=ffffff

[key-bindings]
scrollback-up-page=Page_Up
scrollback-down-page=Page_Down
search-start=Control+Shift+f

[search-bindings]
cancel=Escape
find-prev=Shift+F3
find-next=F3 Control+G
